spec_version: "0.1.0"
name: ebpf-network-drop-diagnoser
version: 1.0.0
description: Instruments kernel sk_buff life-cycles via eBPF kprobes to diagnose TCP buffer exhaustion, conntrack table saturation, and MTU mismatch drops.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - kernel-packet-drop-attribution
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/ebpf-network-drop-diagnoser"
