spec_version: "0.1.0"
name: "ebpf-network-drop-diagnoser"
version: "1.0.0"
category: "devtools"
author: "Rucha Salpure"
description: "Instruments kernel sk_buff life-cycles via eBPF kprobes to diagnose TCP buffer exhaustion, conntrack table saturation, and MTU mismatch drops"
capabilities:
  - "kernel-packet-drop-attribution"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "kernel-packet-drop-attribution"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
